<main>
    <h1>Fale Conosco</h1>

    <p>
        Utilize o formulário abaixo para entrar em contato com a Loja das Frutas.
        Este canal está disponível para dúvidas, sugestões ou solicitações de
        informações.
    </p>
<br><br>
    <form onsubmit="enviarMensagem(); return false;">
        <label>Nome:</label>
        <input type="text" required>

        <label>Telefone:</label>
        <input type="tel" required>

        <label>E-mail:</label>
        <input type="email" required>

        <label>Mensagem:</label>
        <textarea rows="4" required></textarea>

        <button type="submit">Enviar</button>
    </form>
</main>
